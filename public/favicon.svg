    <line x1="48" y1="50" x2="48" y2="58"/>
    <line x1="6" y1="16" x2="14" y2="16"/>
    <line x1="6" y1="32" x2="14" y2="32"/>
    <line x1="6" y1="48" x2="14" y2="48"/>
